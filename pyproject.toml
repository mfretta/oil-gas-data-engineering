[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "oil-gas-data-engineering"
version = "1.0.0"

description = "End-to-end Oil & Gas Data Engineering platform integrating offshore weather, marine conditions, energy prices, rig activity, PostgreSQL analytics, data quality and Streamlit."

readme = "README.md"

requires-python = ">=3.11"

authors = [
    { name = "Murilo Fretta" }
]

dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "openpyxl>=3.1",
    "streamlit>=1.40",
    "plotly>=5.24"
]


[tool.setuptools.packages.find]
where = ["."]

include = [
    "src*"
]