services:

  postgres:
    image: postgres:17

    container_name: oilgas_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: energy_weather
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U weather_user -d energy_weather"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: oilgas_pipeline

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: energy_weather
      DB_USER: weather_user
      DB_PASSWORD: ${DB_PASSWORD}

      EIA_API_KEY: ${EIA_API_KEY}

      PYTHONPATH: /app

    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs

    command:
      [
        "python",
        "-m",
        "src.main"
      ]

    restart: "no"


  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: oilgas_dashboard

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: energy_weather
      DB_USER: weather_user
      DB_PASSWORD: ${DB_PASSWORD}

      EIA_API_KEY: ${EIA_API_KEY}

      PYTHONPATH: /app

    ports:
      - "8501:8501"

    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./.streamlit:/app/.streamlit

    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "src/dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]


volumes:
  postgres_data: